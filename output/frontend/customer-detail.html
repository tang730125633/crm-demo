<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>客户详情 — CRM Demo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .sidebar-link { transition: background 0.15s, color 0.15s; }
    .modal-overlay { backdrop-filter: blur(4px); }
    @keyframes fadeInUp { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
    .fade-in { animation: fadeInUp 0.35s ease both; }
    @keyframes scaleIn { from { opacity:0; transform:scale(0.95); } to { opacity:1; transform:scale(1); } }
    .modal-box { animation: scaleIn 0.2s ease both; }
    /* Timeline */
    .timeline-item:last-child .timeline-line { display: none; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800">

<div class="flex min-h-screen">

  <!-- ===== Sidebar ===== -->
  <aside class="w-60 bg-blue-600 text-white flex flex-col fixed top-0 left-0 h-full z-10 shadow-xl">
    <div class="px-6 py-6 border-b border-blue-500/40">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 bg-white/20 rounded-lg flex items-center justify-center">
          <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/>
          </svg>
        </div>
        <div>
          <div class="font-bold text-base leading-tight">CRM Demo</div>
          <div class="text-blue-200 text-xs">客户关系管理</div>
        </div>
      </div>
    </div>
    <nav class="flex-1 px-3 py-4 space-y-1">
      <p class="px-3 text-blue-300 text-xs font-semibold uppercase tracking-wider mb-2">主菜单</p>
      <a href="index.html" data-nav
        class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-blue-100 hover:bg-blue-700/60 text-sm font-medium">
        <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
        </svg>
        数据看板
      </a>
      <a href="customers.html" data-nav
        class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-blue-100 hover:bg-blue-700/60 text-sm font-medium">
        <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/>
        </svg>
        客户管理
      </a>
    </nav>
    <div class="px-6 py-4 border-t border-blue-500/40">
      <div class="flex items-center gap-2 text-blue-200 text-xs">
        <div class="w-2 h-2 bg-green-400 rounded-full animate-pulse"></div>
        系统正常运行
      </div>
    </div>
  </aside>

  <!-- ===== Main Content ===== -->
  <main class="ml-60 flex-1 p-8">

    <!-- Breadcrumb -->
    <div class="flex items-center gap-2 text-sm text-gray-400 mb-6">
      <a href="customers.html" class="hover:text-blue-600 transition-colors flex items-center gap-1">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
        </svg>
        客户管理
      </a>
      <span>/</span>
      <span id="breadcrumb-name" class="text-gray-600 font-medium">加载中...</span>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-5 gap-6">

      <!-- Left: Customer Info Card -->
      <div class="lg:col-span-2 space-y-5">

        <!-- Info Card -->
        <div id="customer-card" class="bg-white rounded-2xl border border-gray-100 shadow-sm p-6 fade-in">
          <div class="text-center text-gray-400 py-8">加载中...</div>
        </div>

        <!-- Add Follow-up Form -->
        <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-6 fade-in" style="animation-delay:0.1s">
          <h3 class="text-base font-semibold text-gray-900 mb-4">新增跟进记录</h3>
          <form id="followup-form" class="space-y-3">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1.5">跟进方式</label>
              <div class="grid grid-cols-4 gap-2" id="follow-type-selector">
                <!-- Radio buttons styled as chips -->
                <label class="follow-type-chip">
                  <input type="radio" name="follow_type" value="电话" class="sr-only" checked />
                  <div class="chip-inner cursor-pointer text-center py-2 rounded-lg border text-xs font-medium transition-all border-blue-500 bg-blue-50 text-blue-700">
                    <div>📞</div><div>电话</div>
                  </div>
                </label>
                <label class="follow-type-chip">
                  <input type="radio" name="follow_type" value="微信" class="sr-only" />
                  <div class="chip-inner cursor-pointer text-center py-2 rounded-lg border text-xs font-medium transition-all border-gray-200 text-gray-600">
                    <div>💬</div><div>微信</div>
                  </div>
                </label>
                <label class="follow-type-chip">
                  <input type="radio" name="follow_type" value="拜访" class="sr-only" />
                  <div class="chip-inner cursor-pointer text-center py-2 rounded-lg border text-xs font-medium transition-all border-gray-200 text-gray-600">
                    <div>🤝</div><div>拜访</div>
                  </div>
                </label>
                <label class="follow-type-chip">
                  <input type="radio" name="follow_type" value="邮件" class="sr-only" />
                  <div class="chip-inner cursor-pointer text-center py-2 rounded-lg border text-xs font-medium transition-all border-gray-200 text-gray-600">
                    <div>📧</div><div>邮件</div>
                  </div>
                </label>
              </div>
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1.5">跟进内容 <span class="text-red-500">*</span></label>
              <textarea id="followup-content" rows="4" placeholder="记录本次跟进情况..."
                class="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-400 resize-none transition-all"></textarea>
            </div>
            <button type="submit" id="followup-submit"
              class="w-full bg-blue-600 hover:bg-blue-700 text-white px-4 py-2.5 rounded-xl text-sm font-medium transition-colors shadow-sm">
              添加跟进记录
            </button>
          </form>
        </div>
      </div>

      <!-- Right: Follow-up Timeline -->
      <div class="lg:col-span-3 fade-in" style="animation-delay:0.15s">
        <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-6 h-full">
          <div class="flex items-center justify-between mb-5">
            <h3 class="text-base font-semibold text-gray-900">跟进记录</h3>
            <span id="followup-count" class="text-xs text-gray-400 bg-gray-100 px-2.5 py-1 rounded-full">— 条</span>
          </div>
          <div id="followup-timeline">
            <div class="text-center text-gray-400 py-12 text-sm">加载中...</div>
          </div>
        </div>
      </div>

    </div>
  </main>
</div>

<!-- ===== Edit Customer Modal ===== -->
<div id="edit-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center modal-overlay bg-black/30">
  <div class="modal-box bg-white rounded-2xl shadow-2xl w-full max-w-lg mx-4 p-6">
    <div class="flex items-center justify-between mb-5">
      <h2 class="text-lg font-bold text-gray-900">编辑客户</h2>
      <button onclick="closeEditModal()" class="text-gray-400 hover:text-gray-600 transition-colors p-1 rounded-lg hover:bg-gray-100">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>
    <form id="edit-form" class="space-y-4">
      <div class="grid grid-cols-2 gap-4">
        <div class="col-span-2">
          <label class="block text-sm font-medium text-gray-700 mb-1">姓名 <span class="text-red-500">*</span></label>
          <input id="edit-name" type="text" required
            class="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-400 transition-all" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">电话</label>
          <input id="edit-phone" type="tel"
            class="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-400 transition-all" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">邮箱</label>
          <input id="edit-email" type="email"
            class="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-400 transition-all" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">公司</label>
          <input id="edit-company" type="text"
            class="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-400 transition-all" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">状态</label>
          <select id="edit-status"
            class="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-400 bg-white transition-all">
            <option value="潜在客户">潜在客户</option>
            <option value="意向客户">意向客户</option>
            <option value="成交客户">成交客户</option>
            <option value="流失客户">流失客户</option>
          </select>
        </div>
        <div class="col-span-2">
          <label class="block text-sm font-medium text-gray-700 mb-1">备注</label>
          <textarea id="edit-notes" rows="3"
            class="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-400 resize-none transition-all"></textarea>
        </div>
      </div>
      <div class="flex gap-3 pt-2">
        <button type="button" onclick="closeEditModal()"
          class="flex-1 px-4 py-2.5 border border-gray-200 rounded-xl text-sm font-medium text-gray-600 hover:bg-gray-50 transition-colors">
          取消
        </button>
        <button type="submit" id="edit-submit"
          class="flex-1 px-4 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-sm font-medium transition-colors shadow-sm">
          保存修改
        </button>
      </div>
    </form>
  </div>
</div>

<script src="app.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const customerId = params.get('id');
  let customerData = null;

  if (!customerId) {
    document.querySelector('main').innerHTML = `
      <div class="flex items-center justify-center h-64">
        <div class="text-center">
          <div class="text-gray-400 text-lg mb-2">未指定客户 ID</div>
          <a href="customers.html" class="text-blue-500 hover:underline text-sm">返回客户列表</a>
        </div>
      </div>`;
  }

  // ---- Render Customer Info Card ----
  function renderCustomerCard(c) {
    const cfg = STATUS_CONFIG[c.status] || STATUS_CONFIG['潜在客户'];
    document.getElementById('customer-card').innerHTML = `
      <div class="flex items-start justify-between mb-5">
        <div class="flex items-center gap-4">
          <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-blue-500 to-blue-600 flex items-center justify-center text-white text-xl font-bold shadow-md">
            ${c.name.charAt(0)}
          </div>
          <div>
            <h2 class="text-xl font-bold text-gray-900">${c.name}</h2>
            <div class="mt-1">${statusBadge(c.status)}</div>
          </div>
        </div>
        <button onclick="openEditModal()"
          class="text-gray-400 hover:text-blue-600 transition-colors p-2 rounded-lg hover:bg-blue-50">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
          </svg>
        </button>
      </div>

      <div class="space-y-3 text-sm">
        ${c.company ? `
        <div class="flex items-center gap-3 text-gray-600">
          <div class="w-8 h-8 bg-gray-50 rounded-lg flex items-center justify-center shrink-0">
            <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
            </svg>
          </div>
          <span>${c.company}</span>
        </div>` : ''}

        ${c.phone ? `
        <div class="flex items-center gap-3 text-gray-600">
          <div class="w-8 h-8 bg-gray-50 rounded-lg flex items-center justify-center shrink-0">
            <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/>
            </svg>
          </div>
          <span>${c.phone}</span>
        </div>` : ''}

        ${c.email ? `
        <div class="flex items-center gap-3 text-gray-600">
          <div class="w-8 h-8 bg-gray-50 rounded-lg flex items-center justify-center shrink-0">
            <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
            </svg>
          </div>
          <span class="text-blue-500">${c.email}</span>
        </div>` : ''}
      </div>

      ${c.notes ? `
      <div class="mt-5 pt-4 border-t border-gray-100">
        <div class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">备注</div>
        <p class="text-sm text-gray-600 leading-relaxed">${c.notes}</p>
      </div>` : ''}

      <div class="mt-5 pt-4 border-t border-gray-100 grid grid-cols-2 gap-3 text-xs text-gray-400">
        <div>
          <div class="font-medium mb-0.5">创建时间</div>
          <div>${formatDateTime(c.created_at)}</div>
        </div>
        <div>
          <div class="font-medium mb-0.5">最后更新</div>
          <div>${formatDateTime(c.updated_at)}</div>
        </div>
      </div>
    `;
  }

  // ---- Load Customer ----
  async function loadCustomer() {
    try {
      customerData = await apiFetch(`/api/customers/${customerId}`);
      document.getElementById('breadcrumb-name').textContent = customerData.name;
      document.title = `${customerData.name} — CRM Demo`;
      renderCustomerCard(customerData);
    } catch (err) {
      document.getElementById('customer-card').innerHTML = `
        <div class="text-center text-red-400 py-8">加载失败：${err.message}</div>`;
    }
  }

  // ---- Load Follow-ups ----
  async function loadFollowUps() {
    const container = document.getElementById('followup-timeline');
    try {
      const followUps = await apiFetch(`/api/customers/${customerId}/follow-ups`);
      document.getElementById('followup-count').textContent = `${followUps.length} 条`;

      if (!followUps.length) {
        container.innerHTML = `
          <div class="text-center py-16">
            <div class="w-16 h-16 bg-gray-50 rounded-2xl flex items-center justify-center mx-auto mb-3">
              <svg class="w-8 h-8 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                  d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
              </svg>
            </div>
            <p class="text-gray-400 text-sm">暂无跟进记录</p>
            <p class="text-gray-300 text-xs mt-1">使用左侧表单添加第一条记录</p>
          </div>`;
        return;
      }

      const typeConfig = {
        '电话': { icon: '📞', color: 'bg-blue-100 text-blue-700', border: 'border-blue-200' },
        '微信': { icon: '💬', color: 'bg-green-100 text-green-700', border: 'border-green-200' },
        '拜访': { icon: '🤝', color: 'bg-purple-100 text-purple-700', border: 'border-purple-200' },
        '邮件': { icon: '📧', color: 'bg-orange-100 text-orange-700', border: 'border-orange-200' },
      };

      container.innerHTML = `<div class="space-y-4">` + followUps.map((fu, idx) => {
        const tc = typeConfig[fu.follow_type] || { icon: '📋', color: 'bg-gray-100 text-gray-700', border: 'border-gray-200' };
        return `
          <div class="timeline-item flex gap-4">
            <div class="flex flex-col items-center">
              <div class="w-9 h-9 rounded-xl ${tc.color} flex items-center justify-center text-base shrink-0 border ${tc.border}">
                ${tc.icon}
              </div>
              <div class="timeline-line w-px flex-1 bg-gray-100 mt-2 min-h-[12px]"></div>
            </div>
            <div class="flex-1 pb-4">
              <div class="bg-gray-50 rounded-xl p-4 border border-gray-100 hover:border-gray-200 transition-colors group">
                <div class="flex items-start justify-between gap-2 mb-2">
                  <span class="text-xs font-semibold ${tc.color} px-2 py-0.5 rounded-full border ${tc.border}">${fu.follow_type}</span>
                  <div class="flex items-center gap-2">
                    <span class="text-xs text-gray-400">${formatDateTime(fu.created_at)}</span>
                    <button onclick="deleteFollowUp(${fu.id})"
                      class="opacity-0 group-hover:opacity-100 transition-opacity text-gray-300 hover:text-red-500 p-1 rounded-lg hover:bg-red-50">
                      <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                      </svg>
                    </button>
                  </div>
                </div>
                <p class="text-sm text-gray-700 leading-relaxed">${fu.content}</p>
              </div>
            </div>
          </div>`;
      }).join('') + `</div>`;

    } catch (err) {
      container.innerHTML = `<div class="text-center text-red-400 py-8 text-sm">加载失败：${err.message}</div>`;
    }
  }

  // ---- Delete Follow-up ----
  async function deleteFollowUp(id) {
    if (!confirm('确认删除此条跟进记录？')) return;
    try {
      await apiFetch(`/api/follow-ups/${id}`, { method: 'DELETE' });
      showToast('跟进记录已删除', 'success');
      loadFollowUps();
    } catch (err) {
      showToast('删除失败：' + err.message, 'error');
    }
  }

  // ---- Add Follow-up ----
  document.getElementById('followup-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const content = document.getElementById('followup-content').value.trim();
    if (!content) { showToast('请填写跟进内容', 'error'); return; }

    const followType = document.querySelector('input[name="follow_type"]:checked')?.value || '电话';
    const btn = document.getElementById('followup-submit');
    setLoading(btn, true, '提交中...');

    try {
      await apiFetch(`/api/customers/${customerId}/follow-ups`, {
        method: 'POST',
        body: { content, follow_type: followType },
      });
      showToast('跟进记录已添加', 'success');
      document.getElementById('followup-content').value = '';
      loadFollowUps();
    } catch (err) {
      showToast('添加失败：' + err.message, 'error');
    } finally {
      setLoading(btn, false, '添加跟进记录');
    }
  });

  // ---- Follow type radio chip styling ----
  document.querySelectorAll('.follow-type-chip input').forEach(radio => {
    radio.addEventListener('change', function() {
      document.querySelectorAll('.follow-type-chip .chip-inner').forEach(chip => {
        chip.className = 'chip-inner cursor-pointer text-center py-2 rounded-lg border text-xs font-medium transition-all border-gray-200 text-gray-600';
      });
      if (this.checked) {
        this.nextElementSibling.className = 'chip-inner cursor-pointer text-center py-2 rounded-lg border text-xs font-medium transition-all border-blue-500 bg-blue-50 text-blue-700';
      }
    });
  });

  // ---- Edit Modal ----
  function openEditModal() {
    if (!customerData) return;
    document.getElementById('edit-name').value = customerData.name || '';
    document.getElementById('edit-phone').value = customerData.phone || '';
    document.getElementById('edit-email').value = customerData.email || '';
    document.getElementById('edit-company').value = customerData.company || '';
    document.getElementById('edit-status').value = customerData.status || '潜在客户';
    document.getElementById('edit-notes').value = customerData.notes || '';
    document.getElementById('edit-modal').classList.remove('hidden');
  }

  function closeEditModal() {
    document.getElementById('edit-modal').classList.add('hidden');
  }

  document.getElementById('edit-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('edit-submit');
    const payload = {
      name: document.getElementById('edit-name').value.trim(),
      phone: document.getElementById('edit-phone').value.trim(),
      email: document.getElementById('edit-email').value.trim(),
      company: document.getElementById('edit-company').value.trim(),
      status: document.getElementById('edit-status').value,
      notes: document.getElementById('edit-notes').value.trim(),
    };
    if (!payload.name) { showToast('姓名为必填项', 'error'); return; }
    setLoading(btn, true, '保存中...');
    try {
      await apiFetch(`/api/customers/${customerId}`, { method: 'PUT', body: payload });
      showToast('客户信息已更新', 'success');
      closeEditModal();
      customerData = { ...customerData, ...payload };
      document.getElementById('breadcrumb-name').textContent = payload.name;
      renderCustomerCard(customerData);
    } catch (err) {
      showToast('保存失败：' + err.message, 'error');
    } finally {
      setLoading(btn, false, '保存修改');
    }
  });

  document.getElementById('edit-modal').addEventListener('click', function(e) {
    if (e.target === this) closeEditModal();
  });

  // ---- Init ----
  if (customerId) {
    loadCustomer();
    loadFollowUps();
  }
</script>
</body>
</html>
