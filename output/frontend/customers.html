<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>客户管理 — CRM Demo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .sidebar-link { transition: background 0.15s, color 0.15s; }
    .modal-overlay { backdrop-filter: blur(4px); }
    @keyframes fadeInUp { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
    .fade-in { animation: fadeInUp 0.35s ease both; }
    @keyframes scaleIn { from { opacity:0; transform:scale(0.95); } to { opacity:1; transform:scale(1); } }
    .modal-box { animation: scaleIn 0.2s ease both; }
    .table-row { transition: background 0.12s; }
    .table-row:hover { background: #F9FAFB; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800">

<div class="flex min-h-screen">

  <!-- ===== Sidebar ===== -->
  <aside class="w-60 bg-blue-600 text-white flex flex-col fixed top-0 left-0 h-full z-10 shadow-xl">
    <div class="px-6 py-6 border-b border-blue-500/40">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 bg-white/20 rounded-lg flex items-center justify-center">
          <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/>
          </svg>
        </div>
        <div>
          <div class="font-bold text-base leading-tight">CRM Demo</div>
          <div class="text-blue-200 text-xs">客户关系管理</div>
        </div>
      </div>
    </div>
    <nav class="flex-1 px-3 py-4 space-y-1">
      <p class="px-3 text-blue-300 text-xs font-semibold uppercase tracking-wider mb-2">主菜单</p>
      <a href="index.html" data-nav
        class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-blue-100 hover:bg-blue-700/60 text-sm font-medium">
        <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
        </svg>
        数据看板
      </a>
      <a href="customers.html" data-nav
        class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-blue-100 hover:bg-blue-700/60 text-sm font-medium">
        <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/>
        </svg>
        客户管理
      </a>
    </nav>
    <div class="px-6 py-4 border-t border-blue-500/40">
      <div class="flex items-center gap-2 text-blue-200 text-xs">
        <div class="w-2 h-2 bg-green-400 rounded-full animate-pulse"></div>
        系统正常运行
      </div>
    </div>
  </aside>

  <!-- ===== Main Content ===== -->
  <main class="ml-60 flex-1 p-8">

    <!-- Page Header -->
    <div class="flex items-center justify-between mb-6">
      <div>
        <h1 class="text-2xl font-bold text-gray-900">客户管理</h1>
        <p class="text-gray-500 text-sm mt-1">管理所有客户信息与联系记录</p>
      </div>
      <button onclick="openModal()" id="btn-add"
        class="flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white px-4 py-2.5 rounded-xl text-sm font-medium shadow-sm transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
        </svg>
        新增客户
      </button>
    </div>

    <!-- Toolbar -->
    <div class="bg-white rounded-2xl border border-gray-100 shadow-sm mb-5 px-5 py-4">
      <div class="flex flex-col sm:flex-row gap-3">
        <div class="relative flex-1">
          <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
          <input id="search-input" type="text" placeholder="搜索姓名、公司、电话..."
            class="w-full pl-9 pr-4 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-400 transition-all" />
        </div>
        <select id="status-filter"
          class="border border-gray-200 rounded-lg px-3 py-2 text-sm text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-400 bg-white min-w-[130px]">
          <option value="">全部状态</option>
          <option value="潜在客户">潜在客户</option>
          <option value="意向客户">意向客户</option>
          <option value="成交客户">成交客户</option>
          <option value="流失客户">流失客户</option>
        </select>
      </div>
    </div>

    <!-- Table Card -->
    <div class="bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden fade-in">
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead class="bg-gray-50 border-b border-gray-100">
            <tr>
              <th class="text-left px-5 py-3.5 text-xs font-semibold text-gray-500 uppercase tracking-wide">姓名</th>
              <th class="text-left px-5 py-3.5 text-xs font-semibold text-gray-500 uppercase tracking-wide hidden md:table-cell">公司</th>
              <th class="text-left px-5 py-3.5 text-xs font-semibold text-gray-500 uppercase tracking-wide hidden lg:table-cell">电话</th>
              <th class="text-left px-5 py-3.5 text-xs font-semibold text-gray-500 uppercase tracking-wide hidden xl:table-cell">邮箱</th>
              <th class="text-left px-5 py-3.5 text-xs font-semibold text-gray-500 uppercase tracking-wide">状态</th>
              <th class="text-left px-5 py-3.5 text-xs font-semibold text-gray-500 uppercase tracking-wide hidden sm:table-cell">创建时间</th>
              <th class="text-right px-5 py-3.5 text-xs font-semibold text-gray-500 uppercase tracking-wide">操作</th>
            </tr>
          </thead>
          <tbody id="customers-tbody">
            <tr><td colspan="7" class="py-16 text-center text-gray-400">加载中...</td></tr>
          </tbody>
        </table>
      </div>
      <!-- Pagination / count info -->
      <div class="px-5 py-3 border-t border-gray-50 flex items-center justify-between">
        <span id="result-count" class="text-xs text-gray-400"></span>
      </div>
    </div>

  </main>
</div>

<!-- =================== Customer Modal =================== -->
<div id="customer-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center modal-overlay bg-black/30">
  <div class="modal-box bg-white rounded-2xl shadow-2xl w-full max-w-lg mx-4 p-6">
    <div class="flex items-center justify-between mb-5">
      <h2 id="modal-title" class="text-lg font-bold text-gray-900">新增客户</h2>
      <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 transition-colors p-1 rounded-lg hover:bg-gray-100">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>
    <form id="customer-form" class="space-y-4">
      <input type="hidden" id="form-id" />
      <div class="grid grid-cols-2 gap-4">
        <div class="col-span-2">
          <label class="block text-sm font-medium text-gray-700 mb-1">姓名 <span class="text-red-500">*</span></label>
          <input id="form-name" type="text" required placeholder="请输入姓名"
            class="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-400 transition-all" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">电话</label>
          <input id="form-phone" type="tel" placeholder="请输入电话"
            class="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-400 transition-all" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">邮箱</label>
          <input id="form-email" type="email" placeholder="请输入邮箱"
            class="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-400 transition-all" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">公司</label>
          <input id="form-company" type="text" placeholder="请输入公司名称"
            class="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-400 transition-all" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">状态</label>
          <select id="form-status"
            class="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-400 bg-white transition-all">
            <option value="潜在客户">潜在客户</option>
            <option value="意向客户">意向客户</option>
            <option value="成交客户">成交客户</option>
            <option value="流失客户">流失客户</option>
          </select>
        </div>
        <div class="col-span-2">
          <label class="block text-sm font-medium text-gray-700 mb-1">备注</label>
          <textarea id="form-notes" rows="3" placeholder="请输入备注信息"
            class="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-400 resize-none transition-all"></textarea>
        </div>
      </div>
      <div class="flex gap-3 pt-2">
        <button type="button" onclick="closeModal()"
          class="flex-1 px-4 py-2.5 border border-gray-200 rounded-xl text-sm font-medium text-gray-600 hover:bg-gray-50 transition-colors">
          取消
        </button>
        <button type="submit" id="form-submit"
          class="flex-1 px-4 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-sm font-medium transition-colors shadow-sm">
          保存
        </button>
      </div>
    </form>
  </div>
</div>

<!-- =================== Delete Confirm Modal =================== -->
<div id="delete-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center modal-overlay bg-black/30">
  <div class="modal-box bg-white rounded-2xl shadow-2xl w-full max-w-sm mx-4 p-6 text-center">
    <div class="w-14 h-14 bg-red-50 rounded-full flex items-center justify-center mx-auto mb-4">
      <svg class="w-7 h-7 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-2.694-.833-3.464 0L3.34 16.5c-.77.833.192 2.5 1.732 2.5z"/>
      </svg>
    </div>
    <h3 class="text-base font-bold text-gray-900 mb-2">确认删除</h3>
    <p class="text-sm text-gray-500 mb-6">删除后数据将无法恢复，请确认是否继续。</p>
    <div class="flex gap-3">
      <button onclick="closeDeleteModal()"
        class="flex-1 px-4 py-2.5 border border-gray-200 rounded-xl text-sm font-medium text-gray-600 hover:bg-gray-50 transition-colors">
        取消
      </button>
      <button id="confirm-delete"
        class="flex-1 px-4 py-2.5 bg-red-500 hover:bg-red-600 text-white rounded-xl text-sm font-medium transition-colors">
        确认删除
      </button>
    </div>
  </div>
</div>

<script src="/static/app.js"></script>
<script>
  let currentDeleteId = null;

  // ---- Load Customers ----
  async function loadCustomers() {
    const search = document.getElementById('search-input').value.trim();
    const status = document.getElementById('status-filter').value;
    const tbody = document.getElementById('customers-tbody');
    tbody.innerHTML = '<tr><td colspan="7" class="py-16 text-center text-gray-400">加载中...</td></tr>';

    try {
      const params = new URLSearchParams();
      if (search) params.set('search', search);
      if (status) params.set('status', status);

      const data = await apiFetch(`/api/customers?${params}`);
      const customers = data.customers || data || [];
      document.getElementById('result-count').textContent = `共 ${customers.length} 条记录`;

      if (!customers.length) {
        tbody.innerHTML = '<tr><td colspan="7" class="py-16 text-center text-gray-400">暂无客户数据</td></tr>';
        return;
      }

      tbody.innerHTML = customers.map(c => `
        <tr class="table-row border-b border-gray-50">
          <td class="px-5 py-3.5">
            <a href="customer-detail.html?id=${c.id}"
              class="font-medium text-gray-900 hover:text-blue-600 transition-colors">${c.name}</a>
          </td>
          <td class="px-5 py-3.5 text-gray-500 hidden md:table-cell">${c.company || '—'}</td>
          <td class="px-5 py-3.5 text-gray-500 hidden lg:table-cell">${c.phone || '—'}</td>
          <td class="px-5 py-3.5 text-gray-400 text-xs hidden xl:table-cell">${c.email || '—'}</td>
          <td class="px-5 py-3.5">${statusBadge(c.status)}</td>
          <td class="px-5 py-3.5 text-gray-400 text-xs hidden sm:table-cell">${formatDate(c.created_at)}</td>
          <td class="px-5 py-3.5 text-right">
            <div class="flex items-center justify-end gap-1.5">
              <a href="customer-detail.html?id=${c.id}"
                class="px-2.5 py-1 text-xs font-medium text-blue-600 hover:bg-blue-50 rounded-lg transition-colors">
                详情
              </a>
              <button onclick="openModal(${c.id})"
                class="px-2.5 py-1 text-xs font-medium text-gray-600 hover:bg-gray-100 rounded-lg transition-colors">
                编辑
              </button>
              <button onclick="openDeleteModal(${c.id})"
                class="px-2.5 py-1 text-xs font-medium text-red-500 hover:bg-red-50 rounded-lg transition-colors">
                删除
              </button>
            </div>
          </td>
        </tr>
      `).join('');
    } catch (err) {
      tbody.innerHTML = `<tr><td colspan="7" class="py-16 text-center text-red-400">加载失败：${err.message}</td></tr>`;
    }
  }

  // ---- Modal ----
  async function openModal(id = null) {
    document.getElementById('customer-modal').classList.remove('hidden');
    document.getElementById('form-id').value = id || '';
    document.getElementById('modal-title').textContent = id ? '编辑客户' : '新增客户';
    document.getElementById('form-submit').textContent = id ? '保存修改' : '确认添加';
    document.getElementById('customer-form').reset();

    if (id) {
      try {
        const c = await apiFetch(`/api/customers/${id}`);
        document.getElementById('form-name').value = c.name || '';
        document.getElementById('form-phone').value = c.phone || '';
        document.getElementById('form-email').value = c.email || '';
        document.getElementById('form-company').value = c.company || '';
        document.getElementById('form-status').value = c.status || '潜在客户';
        document.getElementById('form-notes').value = c.notes || '';
      } catch (err) {
        showToast('客户信息加载失败：' + err.message, 'error');
        closeModal();
      }
    }
  }

  function closeModal() {
    document.getElementById('customer-modal').classList.add('hidden');
  }

  // ---- Delete Modal ----
  function openDeleteModal(id) {
    currentDeleteId = id;
    document.getElementById('delete-modal').classList.remove('hidden');
  }

  function closeDeleteModal() {
    currentDeleteId = null;
    document.getElementById('delete-modal').classList.add('hidden');
  }

  document.getElementById('confirm-delete').addEventListener('click', async () => {
    if (!currentDeleteId) return;
    const btn = document.getElementById('confirm-delete');
    setLoading(btn, true, '删除中...');
    try {
      await apiFetch(`/api/customers/${currentDeleteId}`, { method: 'DELETE' });
      showToast('客户已删除', 'success');
      closeDeleteModal();
      loadCustomers();
    } catch (err) {
      showToast('删除失败：' + err.message, 'error');
    } finally {
      setLoading(btn, false, '确认删除');
    }
  });

  // ---- Form Submit ----
  document.getElementById('customer-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('form-submit');
    const id = document.getElementById('form-id').value;
    const payload = {
      name: document.getElementById('form-name').value.trim(),
      phone: document.getElementById('form-phone').value.trim(),
      email: document.getElementById('form-email').value.trim(),
      company: document.getElementById('form-company').value.trim(),
      status: document.getElementById('form-status').value,
      notes: document.getElementById('form-notes').value.trim(),
    };

    if (!payload.name) {
      showToast('姓名为必填项', 'error');
      return;
    }

    setLoading(btn, true, '保存中...');
    try {
      if (id) {
        await apiFetch(`/api/customers/${id}`, { method: 'PUT', body: payload });
        showToast('客户信息已更新', 'success');
      } else {
        await apiFetch('/api/customers', { method: 'POST', body: payload });
        showToast('客户添加成功', 'success');
      }
      closeModal();
      loadCustomers();
    } catch (err) {
      showToast('操作失败：' + err.message, 'error');
    } finally {
      setLoading(btn, false, id ? '保存修改' : '确认添加');
    }
  });

  // ---- Search & Filter ----
  let searchTimer;
  document.getElementById('search-input').addEventListener('input', () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(loadCustomers, 350);
  });
  document.getElementById('status-filter').addEventListener('change', loadCustomers);

  // Close modal on backdrop click
  document.getElementById('customer-modal').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
  });
  document.getElementById('delete-modal').addEventListener('click', function(e) {
    if (e.target === this) closeDeleteModal();
  });

  loadCustomers();
</script>
</body>
</html>
